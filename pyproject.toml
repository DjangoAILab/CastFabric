[project]
name = "castfabric"
version = "0.10.0a1"
description = "Open-source multi-protocol casting fabric for LAN audio devices"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "miservice-fork",
    "zeroconf>=0.38.0",
    "pycryptodome>=3.15.0",
    "av>=10.0.0",
]

[project.scripts]
castfabric = "miair.cli:main"
castfabric-miplay = "miair.miplay.probe:main"
miair = "miair.cli:main"
openxiaocast = "miair.cli:main"
openxiaocast-miplay = "miair.miplay.probe:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["miair*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

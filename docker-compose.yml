services:
  castfabric:
    image: ghcr.io/djangoailab/castfabric:latest
    build:
      context: .
    container_name: castfabric
    network_mode: host
    restart: unless-stopped
    environment:
      CASTFABRIC_DOCKER: "1"
      CASTFABRIC_HOSTNAME: "${CASTFABRIC_HOSTNAME:-}"
    volumes:
      - "${CASTFABRIC_CONFIG_DIR:-./conf}:/app/conf"

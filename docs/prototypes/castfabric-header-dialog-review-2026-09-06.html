:root{--bg:#f4f1e9;--paper:#fffcf7;--ink:#252824;--muted:#74786f;--line:#dcd7ce;--accent:#f35f45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Avenir Next","PingFang SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:inherit;text-decoration:none}svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #b8422f;outline-offset:3px}.shell{max-width:1480px;margin:auto;padding:0 32px}.header{display:flex;align-items:center;gap:24px;min-height:88px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;flex:none}.brand img{width:42px;height:42px}.brand strong{display:block;font-size:18px;letter-spacing:-.6px}.brand small{display:block;font-size:8px;letter-spacing:1.6px;color:var(--muted)}nav{display:flex;gap:4px;margin:auto}nav button{border:0;background:none;border-radius:24px;padding:9px 14px;white-space:nowrap;color:var(--muted)}nav .active{background:var(--ink);color:white}.tools{display:flex;align-items:center;gap:3px;flex:none}.tool{height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;display:inline-flex;gap:7px;align-items:center;font-size:12px;white-space:nowrap}.tool:hover{background:#e9e5dc}.tools .separate{border-left:1px solid var(--line);height:20px;margin:0 4px}.language{position:relative}.chevron{width:12px;height:12px}.menu{position:absolute;top:48px;right:0;min-width:178px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 35px #25282418;z-index:10}.menu[hidden]{display:none}.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:0;border-radius:6px;padding:10px;text-align:left}.menu bu x-width:calc(100% - 24px);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fffcf7f5;box-shadow:0 8px 24px #25282412;font-size:11px;z-index:15}.review strong{white-space:nowrap}.review select{background:transparent;border:1px solid var(--line);padding:5px;border-radius:5px;max-width:150px}.review label{display:flex;align-items:center;gap:6px;white-space:nowrap}.state{padding:64px 15px;text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:24px}.state h3{font-size:17px}.alert{background:#fff0dd;border:1px solid #e6cfad;padding:12px 16px;border-radius:8px;margin-bottom:16px;color:#77531f}.alert.error{background:#fff0eb;color:#a73722;border-color:#ebc1b7}.visually-hidden{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}.toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--ink);color:white;border-radius:12px;z-index:25}.toast[hidden]{display:none}
dialog{border:1px solid var(--line);padding:0;margin:auto;width:min(600px,calc(100vw - 32px));max-height:calc(100dvh - 32px);border-radius:20px;background:var(--bg);color:var(--ink);box-shadow:0 28px 80px #25282433}dialog::backdrop{background:#25282440;backdrop-filter:blur(3px)}dialog[open]{display:flex;flex-direction:column}.dialog-head{padding:25px 28px 22px;border-bottom:1px solid var(--line);position:relative;flex:none}.dialog-head h2{font:28px/1.35 Baskerville,"Songti SC",serif;margin:4px 48px 6px 0}.dialog-head p{font-size:12px}.close{position:absolute;right:20px;top:22px;border:1px solid var(--line);background:var(--paper);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}.dialog-body{padding:24px 28px;min-height:0;overflow:auto;display:grid;gap:20px}.field{display:grid;gap:8px;font-size:12px}.field small{color:var(--muted)}input,textarea,select{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:12px;width:100%}textarea{min-height:82px;resize:vertical}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dialog-footer{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);padding:18px 28px;flex:none}.field-error{color:#a73722;font-size:12px;margin:0}.field-error[hidden]{display:none}.invalid{border-color:#ba432b}#connectionDialog .dialog-body{font-size:14px;line-height:1.8}

<div class="shell"><header class="header"><a class="brand" href="#" aria-label="CastFabric"><img src="../assets/castfabric-mark.svg" alt=""><div><strong>CastFabric</strong><small>OPEN LOCAL AUDIO</small></div></a>
<nav aria-label="主导航"><button data-zh="总览" data-en="Overview"></button><button data-zh="音响" data-en="Speakers"></button><button class="active" data-zh="播放列表" data-en="Playlists"></button><button data-zh="活动" data-en="Activity"></button><button data-zh="AI 接入" data-en="AI access"></button></nav>
<div class="tools" id="tools"><a class="tool" href="https://github.com/DjangoAILab/CastFabric" target="_blank" rel="noopener noreferrer" data-label-zh="开源项目（新标签页）" data-label-en="Source code (new tab)"><svg aria-hidden="true"><use href="#github"/></svg><span data-zh="开源项目" data-en="Source code"></span></a><i class="separate" aria-hidden="true"></i><div class="language"><button class="tool" id="languageButton" aria-expanded="false" aria-controls="languageMenu" data-label-zh="语言：简体中文" data-label-en="Language: English"><svg aria-hidden="true"><use href="#language"/></svg><span id="currentLanguage">简体中文</span><svg class="chevron" aria-hidden="true"><use href="#chevron"/></svg></button><div class="menu" id="languageMenu" hidden><button data-lang="zh"><span>简体中文</span><svg aria-hidden="true"><use href="#check"/></svg></button><button data-lang="en"><span>English</span><svg aria-hidden="true"><use href="#check"/></svg></button></div></div><button class="tool" id="connections" data-label-zh="连接配置" data-label-en="Connections"><svg aria-hidden="true"><use href="#settings"/></svg><span data-zh="连接配置" data-en="Connections"></span></button></div></header>
<main><div class="heading"><div><div class="eyebrow">YOUR LISTENING SPACE</div><h1 data-zh="播放列表" data-en="Playlists"></h1><p data-zh="整理想听的内容，播放到你的音响。" data-en="Organize what you love. Listen on your speakers."></p></div><button class="primary" id="create"><svg aria-hidden="true"><use href="#plus"/></svg><span data-zh="新建播放列表" data-en="New playlist"></span></button></div><div id="status"></div><section class="workspace"><aside class="sidebar"><h2 data-zh="我的播放列表" data-en="My playlists"></h2><button class="list-link active" data-list="book"><strong>有声书 · 鲁迅《呐喊》</strong><small data-zh="16 节 · 顺序播放" data-en="16 chapters · Sequential"></small></button><button class="list-link" data-list="music"><strong data-zh="睡眠轻音乐 · 钢琴与氛围" data-en="Sleep · Piano & ambient"></strong><small data-zh="4 首 · 顺序播放" data-en="4 tracks · Sequential"></small></button></aside><div class="content" id="content"></div></section><p class="note" data-zh="不挑协议，投了就播" data-en="Any protocol. Just play."></p></main></div>
<div class="review"><strong>离线评审原型</strong><label>方向 <select id="direction"><option value="a">A · 文字 + 图标（推荐）</option><option value="b">B · 纯图标</option></select></label><label>状态 <select id="state"><option value="ready">正常</option><option value="empty">空列表</option><option value="loading">加载中</option><option value="degraded">服务降级</option><option value="error">请求错误</option></select></label><span class="review-note">仅预览，不连接生产 API</span></div>
<dialog id="playlistDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><div class="eyebrow">CASTFABRIC</div><h2 id="dialogTitle" data-zh="新建播放列表" data-en="New playlist"></h2><p data-zh="名称与默认播放方式用于下一次启动。" data-en="Name and playback defaults apply next time you start."></p><button class="close" data-close data-label-zh="关闭" data-label-en="Close"><svg aria-hidden="true"><use href="#close"/></svg></button></div><form id="playlistForm" class="dialog-body" novalidate><label class="field"><span data-zh="名称" data-en="Name"></span><input id="playlistName" name="name" autofocus maxlength="120" aria-describedby="nameError"><span id="nameError" class="field-error" hidden data-zh="请填写播放列表名称。" data-en="Enter a playlist name."></span></label><label class="field"><span data-zh="说明（可选）" data-en="Description (optional)"></span><textarea name="description" rows="3"></textarea></label><div class="two-fields"><label class="field"><span data-zh="默认顺序" data-en="Default order"></span><select><option data-zh="顺序播放" data-en="Sequential"></option><option data-zh="随机播放" data-en="Shuffle"></option></select></label><label class="field"><span data-zh="播放结束" data-en="When finished"></span><select><option data-zh="停止" data-en="Stop"></option><option data-zh="列表循环" data-en="Repeat playlist"></option><option data-zh="单曲循环" data-en="Repeat one"></option></select></label></div><p id="saveError" class="field-error" hidden data-zh="暂时无法保存，填写内容已保留，请稍后重试。" data-en="Could not save. Your entries are preserved. Please try again."></p></form><div class="dialog-footer"><button class="secondary" data-close data-zh="取消" data-en="Cancel"></button><button class="primary" type="submit" form="playlistForm" id="save" data-zh="创建播放列表" data-en="Create playlist"></button></div></dialog>
<dialog id="connectionDialog" aria-labelledby="connectionTitle"><div class="dialog-head"><h2 id="connectionTitle" data-zh="连接配置" data-en="Connections"></h2><button class="close" data-close data-label-zh="关闭" data-label-en="Close"><svg aria-hidden="true"><use href="#close"/></svg></button></div><div class="dialog-body"><p data-zh="这里保留现有连接配置入口，本次不重设计配置表单。" data-en="This entry opens the existing connection settings. The settings form is unchanged in this revision."></p><p data-zh="原型不会修改服务或音响配置。" data-en="This prototype does not modify the server or speakers."></p></div><div class="dialog-footer"><button class="secondary" data-close data-zh="关闭" data-en="Close"></button></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);let lang='zh',selected='book';const t=(zh,en)=>lang==='zh'?zh:en;
const tracks={book:[['01','自序','11:36'],['02','狂人日记','20:34'],['03','孔乙己','11:02'],['04','药','18:42'],['05','明天','14:25']],music:[['01','Sleep · 梦境',''],['02','Moonlight · 月光',''],['03','Solace · 慰藉',''],['04','Hiraeth · 归心','']]};
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-zh]').forEach(e=>e.textContent=e.dataset[lang]);document.querySelectorAll('[data-label-zh]').forEach(e=>{e.setAttribute('aria-label',e.dataset[lang==='zh'?'labelZh':'labelEn']);e.title=e.getAttribute('aria-label')});$('#currentLanguage').textContent=t('简体中文','English');document.querySelectorAll('[data-lang]').forEach(e=>{e.querySelector('svg').style.visibility=e.dataset.lang===lang?'visible':'hidden';e.setAttribute('aria-pressed',String(e.dataset.lang===lang))});renderContent()}
function renderContent(){let state=$('#state').value;$('#status').innerHTML=state==='degraded'?`<div class="alert">${t('音响暂时离线。可以继续整理内容，恢复连接后再播放。','Speaker offline. You can still organize your content.')}</div>`:state==='error'?`<div class="alert error">${t('暂时无法读取播放列表。请稍后重试。','Could not load playlists. Please try again.')}</div>`:'';if(['empty','loading','error'].includes(state)){$('#content').innerHTML=`<div class="state" role="status"><h3>${state==='empty'?t('从想听的内容开始','Start with something to listen to'):state==='loading'?t('正在读取播放列表…','Loading playlists…'):t('未能加载内容','Unable to load content')}</h3><p>${state==='empty'?t('新建播放列表，再添加音频。','Create a playlist, then add audio.'):state==='loading'?t('请稍候','Please wait'):t('已保存的内容不会因此丢失。','Your saved content is safe.')}</p></div>`;return}let book=selected==='book';$('#content').innerHTML=`<div class="summary"><div><h2>${book?'鲁迅《呐喊》':t('钢琴与氛围','Piano & ambient')}</h2><p>${book?t('Jing Li 朗读 · 全书 16 节','Read by Jing Li · 16 chapters'):t('Scott Buckley · 4 首 · CC BY 4.0','Scott Buckley · 4 tracks · CC BY 4.0')}</p></div><button class="primary" id="playDemo" ${state==='degraded'?'disabled':''}><svg aria-hidden="true"><use href="#play"/></svg>${t('全部播放','Play all')}</button></div><div class="tracks">${tracks[selected].map(x=>`<div class="track"><span class="num">${x[0]}</span><span>${x[1]}</span><span class="duration">${x[2]}</span><svg aria-hidden="true"><use href="#play"/></svg></div>`).join('')}</div><p class="note">${book?t('此处预览前 5 节；真实播放列表包含完整 16 节。','Previewing 5 chapters; the real playlist contains all 16.'):t('保留每首音乐的作者、授权与来源。','Artist, license and source are retained for every track.')}</p>`;$('#playDemo').onclick=()=>toast(t('离线原型，不启动音响。','Offline prototype. No speaker playback.'))}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2600)}
function closeMenu(){$('#languageMenu').hidden=true;$('#languageButton').setAttribute('aria-expanded','false')}
$('#languageButton').onclick=()=>{const open=$('#languageMenu').hidden;$('#languageMenu').hidden=!open;$('#languageButton').setAttribute('aria-expanded',String(open));if(open)$('#languageMenu button').focus()};document.querySelectorAll('[data-lang]').forEach(e=>e.onclick=()=>{lang=e.dataset.lang;closeMenu();render();$('#languageButton').focus()});document.addEventListener('click',e=>{if(!e.target.closest('.language'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#languageMenu').hidden){closeMenu();$('#languageButton').focus()}});
$('#direction').onchange=e=>$('#tools').classList.toggle('icon-only',e.target.value==='b');$('#state').onchange=renderContent;document.querySelectorAll('[data-list]').forEach(e=>e.onclick=()=>{selected=e.dataset.list;document.querySelectorAll('[data-list]').forEach(b=>b.classList.toggle('active',b===e));renderContent()});
$('#create').onclick=()=>{$('#playlistForm').reset();$('#nameError').hidden=true;$('#saveError').hidden=true;$('#playlistName').classList.remove('invalid');$('#playlistName').removeAttribute('aria-invalid');$('#playlistDialog').showModal()};$('#connections').onclick=()=>$('#connectionDialog').showModal();document.querySelectorAll('[data-close]').forEach(e=>e.onclick=()=>e.closest('dialog').close());
$('#playlistForm').onsubmit=e=>{e.preventDefault();if(!$('#playlistName').value.trim()){$('#nameError').hidden=false;$('#playlistName').classList.add('invalid');$('#playlistName').setAttribute('aria-invalid','true');$('#playlistName').focus();return}if($('#state').value==='error'){$('#saveError').hidden=false;return}$('#save').disabled=true;$('#save').textContent=t('创建中…','Creating…');setTimeout(()=>{$('#save').disabled=false;$('#playlistDialog').close();render();toast(t('原型演示完成；没有修改真实播放列表。','Demo complete. No real playlist was changed.'))},550)};$('#playlistName').oninput=()=>{$('#nameError').hidden=true;$('#playlistName').classList.remove('invalid');$('#playlistName').removeAttribute('aria-invalid')};
document.querySelectorAll('dialog').forEach(dialog=>{dialog.addEventListener('keydown',event=>{if(event.key!=='Tab')return;const items=[...dialog.querySelectorAll('button:not(:disabled),input,textarea,select')].filter(item=>item.getClientRects().length);const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}})});
render();
</script></html>

name: Test CastFabric

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run unit and integration tests
        run: python -m pytest -q
      - name: Run Agent Skill tests
        run: node --test skills/castfabric/tests/*.test.mjs
      - name: Run offline MiPlay wire self-test
        run: python -m miair.miplay.probe self-test --duration 0.35

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: castfabric:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run MiPlay self-test in image
        run: docker run --rm --entrypoint python castfabric:test -m miair.miplay.probe self-test --duration 0.35
      - name: Cold-start container and verify production HTTP surfaces
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name castfabric-ci \
            -e CASTFABRIC_HOSTNAME=127.0.0.1 \
            -p 18300:8300 castfabric:test
          cleanup() {
            docker logs castfabric-ci || true
            docker rm -f castfabric-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          expected_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:18300/api/status \
            | EXPECTED_VERSION="$expected_version" python -c "import json,os,sys; d=json.load(sys.stdin); assert d['version']==os.environ['EXPECTED_VERSION']; assert d['xiaomi_extension_enabled'] is False"
          curl --fail --silent http://127.0.0.1:18300/api/v1/system \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['product']=='CastFabric'; assert d['health']=='idle'; assert d['targets']['count']==0"
          curl --fail --silent --show-error \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"container-smoke","version":"1"}}}' \
            http://127.0.0.1:18300/mcp \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['result']['serverInfo']['name']=='CastFabric'"
          curl --fail --silent http://127.0.0.1:18300/ \
            | grep -q 'console.js'

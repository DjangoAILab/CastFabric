name: Deploy CastFabric Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages.sh"
      - "docs/prototypes/castfabric-landing-v1.html"
      - "docs/assets/castfabric-mark.svg"
      - "docs/assets/console-overview.png"
      - "docs/assets/console-mobile.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build static site
        run: bash scripts/build_pages.sh "$RUNNER_TEMP/castfabric-pages"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/castfabric-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
